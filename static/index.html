<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All in One | Real-Time News Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Newsreader', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    .word-cloud-token {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-block;
      cursor: pointer;
      user-select: none;
      line-height: 1.15;
    }
    .word-cloud-token:hover {
      transform: translateY(-2px) scale(1.08);
      filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.35));
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans selection:bg-sky-500/30 selection:text-sky-200">

  <!-- TOP BAR -->
  <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-serif text-xl font-bold text-white shadow-lg shadow-sky-500/20">
          A
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-serif text-xl font-bold tracking-tight text-white">All in One</h1>
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-mono font-medium bg-sky-500/10 text-sky-400 border border-sky-500/20">LIVE</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">Curated Algorithmic Consensus Engine</p>
        </div>
      </div>

      <!-- Controls & Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="relative hidden md:block">
          <input 
            type="text" 
            id="searchInput"
            placeholder="Search topic or press '/'..." 
            class="bg-slate-900/90 text-xs text-slate-200 rounded-lg pl-8 pr-3 py-1.5 w-52 focus:w-64 focus:outline-none focus:ring-1 focus:ring-sky-500 border border-slate-800 transition-all placeholder:text-slate-500 font-mono"
          />
          <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>

        <button onclick="toggleBookmarksModal(true)" class="relative p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
          </svg>
          <span id="bookmarkBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-sky-500 rounded-full text-[9px] font-bold flex items-center justify-center text-white">0</span>
        </button>

        <button onclick="togglePreferencesModal(true)" class="p-2 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:border-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN SCROLLER -->
  <main class="flex-1 overflow-y-auto custom-scroll">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

      <!-- SLIDERS & CONTROLS DASHBOARD -->
      <section class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-4 sm:p-5">
        <div class="flex flex-col lg:flex-row items-center justify-between gap-4">
          
          <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
            <!-- Regional Scope -->
            <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center flex-1 sm:flex-initial">
              <button 
                id="btnScopeAU" 
                onclick="setScope('au')" 
                class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200">
                🇦🇺 Australia Focus
              </button>
              <button 
                id="btnScopeGlobal" 
                onclick="setScope('global')" 
                class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-sky-500 text-white font-semibold shadow-sm">
                🌐 Global Blended
              </button>
            </div>

            <!-- Time Horizon -->
            <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center flex-1 sm:flex-initial">
              <button 
                id="btnTimeDaily" 
                onclick="setTimeFrame('daily')" 
                class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-white font-semibold">
                ⚡ 24 Hours
              </button>
              <button 
                id="btnTimeWeekly" 
                onclick="setTimeFrame('weekly')" 
                class="px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200">
                📅 7 Days
              </button>
            </div>
          </div>

          <!-- Active filters & View Toggles -->
          <div class="flex items-center justify-between w-full lg:w-auto gap-3">
            <div id="activeKeywordBadge" class="hidden items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-500/20 text-sky-300 border border-sky-500/30 text-xs font-mono">
              <span id="activeKeywordText">topic</span>
              <button onclick="clearKeywordFilter()" class="hover:text-white ml-1">✕</button>
            </div>

            <div class="flex items-center gap-2">
              <div class="bg-slate-950 p-1 rounded-xl border border-slate-800 flex items-center">
                <button 
                  id="btnViewCard" 
                  onclick="setViewMode('card')" 
                  title="Card View (V)" 
                  class="p-1.5 rounded-lg text-xs transition-all bg-slate-800 text-white">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                  </svg>
                </button>
                <button 
                  id="btnViewList" 
                  onclick="setViewMode('list')" 
                  title="List View (V)" 
                  class="p-1.5 rounded-lg text-xs transition-all text-slate-400 hover:text-slate-200">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                  </svg>
                </button>
              </div>

              <button 
                id="btnRestoreDismissed" 
                onclick="restoreDismissed()" 
                class="hidden text-xs text-slate-400 hover:text-slate-200 underline font-mono px-2 py-1">
                Restore (<span id="dismissedCount">0</span>)
              </button>
            </div>

          </div>

        </div>

        <!-- Pinned Strip -->
        <div id="pinnedTopicsBar" class="mt-3 pt-3 border-t border-slate-800/60 flex items-center gap-2 overflow-x-auto text-xs font-mono">
          <span class="text-slate-500 whitespace-nowrap">PINNED:</span>
          <div id="pinnedTopicsContainer" class="flex items-center gap-1.5"></div>
        </div>
      </section>

      <!-- AUTHENTIC ORGANIC WORD CLOUD (SPIRAL COLLISION) -->
      <section class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 relative overflow-hidden">
        <div class="flex items-center justify-between mb-2 border-b border-slate-800/60 pb-2">
          <span class="text-[11px] font-mono uppercase tracking-widest text-slate-400 font-semibold flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Semantic Heatmap
          </span>
          <span id="cloudTermCount" class="text-[10px] font-mono text-slate-500">Calculating...</span>
        </div>
        
        <div id="wordCloudContainer" class="relative w-full h-64 sm:h-72 flex items-center justify-center overflow-hidden select-none"></div>
      </section>

      <!-- HEADLINES STREAM -->
      <section>
        <div class="flex items-center justify-between mb-4 px-1">
          <div class="flex items-center gap-2">
            <h2 class="text-base font-semibold text-slate-200">Curated Intelligence</h2>
            <span id="articleCountBadge" class="text-xs font-mono text-slate-500">Loading feeds...</span>
          </div>
          <div class="flex items-center gap-2 text-xs font-mono text-slate-400">
            <span>SORT:</span>
            <select id="sortSelect" onchange="handleSortChange(this.value)" class="bg-slate-900 border border-slate-800 rounded px-2 py-1 text-slate-200 focus:outline-none">
              <option value="score">Algorithmic Consensus</option>
              <option value="time">Latest Published</option>
              <option value="perspectives">Most Multi-Source</option>
            </select>
          </div>
        </div>

        <div id="headlinesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <div id="emptyState" class="hidden text-center py-16 text-slate-500 font-mono text-sm">
          No stories matching current filters. Try resetting topic filters or scope.
        </div>
      </section>

    </div>
  </main>

  <!-- SAVED ARTICLES MODAL -->
  <div id="bookmarksModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex justify-end">
    <div class="w-full max-w-md bg-slate-900 h-full border-l border-slate-800 p-6 flex flex-col justify-between shadow-2xl">
      <div>
        <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-4">
          <h3 class="font-serif text-lg font-bold text-white">Saved Reading List</h3>
          <button onclick="toggleBookmarksModal(false)" class="text-slate-400 hover:text-white text-lg">✕</button>
        </div>
        <div id="bookmarksList" class="space-y-3 overflow-y-auto max-h-[70vh] custom-scroll"></div>
      </div>
      <div class="border-t border-slate-800 pt-4 flex gap-2">
        <button onclick="exportBookmarks('md')" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-mono rounded text-slate-200">Export .MD</button>
        <button onclick="exportBookmarks('json')" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-mono rounded text-slate-200">Export .JSON</button>
      </div>
    </div>
  </div>

  <!-- PREFERENCES MODAL -->
  <div id="preferencesModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-lg bg-slate-900 rounded-2xl border border-slate-800 p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-serif text-lg font-bold text-white">Feed Preferences</h3>
        <button onclick="togglePreferencesModal(false)" class="text-slate-400 hover:text-white">✕</button>
      </div>
      
      <div>
        <label class="text-xs font-mono uppercase text-slate-400 block mb-1">Pin Custom Topics (+1.5 Boost)</label>
        <div class="flex gap-2">
          <input type="text" id="newTopicInput" placeholder="e.g. Semiconductors, Central Banks" class="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-xs text-white" />
          <button onclick="addPinnedTopic()" class="px-3 py-1.5 bg-sky-600 text-xs rounded text-white font-medium">Add</button>
        </div>
        <div id="prefPinnedList" class="flex flex-wrap gap-1.5 mt-2"></div>
      </div>

      <div class="pt-2 border-t border-slate-800/60">
        <label class="text-xs font-mono uppercase text-slate-400 block mb-1">Mute Specific Keywords</label>
        <div class="flex gap-2">
          <input type="text" id="newMuteInput" placeholder="e.g. Gossip, Property" class="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-1.5 text-xs text-white" />
          <button onclick="addMutedKeyword()" class="px-3 py-1.5 bg-rose-700 text-xs rounded text-white font-medium">Mute</button>
        </div>
        <div id="prefMutedList" class="flex flex-wrap gap-1.5 mt-2"></div>
      </div>

      <div class="text-right pt-3 border-t border-slate-800">
        <button onclick="togglePreferencesModal(false)" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded text-white">Done</button>
      </div>
    </div>
  </div>

  <!-- UNDO TOAST -->
  <div id="undoToast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 shadow-xl rounded-xl px-4 py-3 flex items-center gap-3">
    <span class="text-xs text-slate-300 font-medium">Story dismissed</span>
    <button onclick="undoDismiss()" class="text-xs font-mono font-bold text-sky-400 hover:text-sky-300 underline">UNDO</button>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    const state = {
      scope: 'global',
      timeFrame: 'daily',
      viewMode: 'card',
      sortBy: 'score',
      keywordFilter: null,
      searchQuery: '',
      articles: [],
      dismissedIds: new Set(JSON.parse(localStorage.getItem('aio_dismissed') || '[]')),
      bookmarks: new Map(JSON.parse(localStorage.getItem('aio_bookmarks') || '[]')),
      // Cleaned defaults to avoid unintended domestic bias
      pinnedTopics: new Set(JSON.parse(localStorage.getItem('aio_pinned') || '["Semiconductors", "Central Banks"]')),
      mutedKeywords: new Set(JSON.parse(localStorage.getItem('aio_muted') || '[]')),
      lastDismissedId: null
    };

    async function loadLiveHeadlines() {
      const badge = document.getElementById('articleCountBadge');
      badge.textContent = 'Syncing feeds...';

      try {
        const response = await fetch(`/api/news?scope=${state.scope}&time_frame=${state.timeFrame}`);
        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
        const data = await response.json();
        
        state.articles = data.articles || [];
        renderApp();
      } catch (err) {
        console.warn('Live API unreachable, check server:', err);
        renderApp();
      }
    }

    function renderApp() {
      renderPinnedBar();
      renderWordCloud();
      renderArticles();
      updateBookmarkUI();
      updateDismissedUI();
    }

    function getProcessedArticles() {
      return state.articles.filter(art => {
        // Check all possible identifier representations as strings
        const artId = String(art.id ?? '');
        const artGuid = String(art.guid_hash ?? '');
        const artUrl = String(art.url ?? '');

        if (
          (artId && state.dismissedIds.has(artId)) ||
          (artGuid && state.dismissedIds.has(artGuid)) ||
          (artUrl && state.dismissedIds.has(artUrl))
        ) {
          return false;
        }

        // Muted keywords check
        const textToSearch = `${art.title} ${art.summary || ''}`.toLowerCase();
        for (const muted of state.mutedKeywords) {
          if (textToSearch.includes(muted.toLowerCase())) return false;
        }

        // Active Word Cloud Keyword Filter
        if (state.keywordFilter && !textToSearch.includes(state.keywordFilter.toLowerCase())) {
          return false;
        }

        // Text Search query
        if (state.searchQuery && !textToSearch.includes(state.searchQuery.toLowerCase())) {
          return false;
        }

        return true;
      }).map(art => {
        let score = typeof art.final_score === 'number' ? art.final_score : 5.0;
        for (const topic of state.pinnedTopics) {
          if (`${art.title} ${art.summary || ''}`.toLowerCase().includes(topic.toLowerCase())) {
            score += 1.5;
          }
        }
        return { ...art, dynamicScore: Math.round(score * 10) / 10 };
      }).sort((a, b) => {
        if (state.sortBy === 'time') return new Date(b.published_at) - new Date(a.published_at);
        if (state.sortBy === 'perspectives') return (b.perspectives?.length || 0) - (a.perspectives?.length || 0);
        return b.dynamicScore - a.dynamicScore;
      });
    }

    function renderArticles() {
      const container = document.getElementById('headlinesContainer');
      const emptyState = document.getElementById('emptyState');
      const items = getProcessedArticles();

      document.getElementById('articleCountBadge').textContent = `${items.length} stories available`;

      if (items.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      if (state.viewMode === 'card') {
        container.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';
        container.innerHTML = items.map(art => renderCardHTML(art)).join('');
      } else {
        container.className = 'flex flex-col gap-2.5';
        container.innerHTML = items.map(art => renderListRowHTML(art)).join('');
      }
    }

    function renderCardHTML(art) {
      const isSaved = state.bookmarks.has(art.url);
      const toneBorder = art.tone === 'bullish' ? 'border-l-emerald-500' : art.tone === 'caution' ? 'border-l-rose-500' : 'border-l-sky-500';
      const hasPerspectives = art.perspectives && art.perspectives.length > 0;
      const readMinutes = Math.max(2, Math.ceil((art.summary?.length || 100) / 75));

      return `
        <article class="bg-slate-900/70 hover:bg-slate-900 border border-slate-800 hover:border-slate-700/80 rounded-xl p-4 flex flex-col justify-between transition-all border-l-4 ${toneBorder} relative shadow-sm">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2 font-mono text-[11px] text-slate-400">
              <span class="font-semibold text-slate-300 truncate">${art.source_name}</span>
              <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 text-[10px] uppercase">${art.content_type || 'wire'}</span>
                <span class="text-slate-500 font-mono text-[10px]">${readMinutes}m</span>
                <span class="px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-400 text-[10px] font-bold border border-sky-500/20" title="Consensus Score">${art.dynamicScore}</span>
              </div>
            </div>

            <h3 class="font-serif text-lg font-bold leading-snug text-slate-100 hover:text-sky-300 transition-colors mb-2">
              <a href="${art.url}" target="_blank" rel="noopener noreferrer">${art.title}</a>
            </h3>

            <p class="text-xs text-slate-400 leading-relaxed line-clamp-3 mb-3 font-sans">
              ${art.summary || 'Summary unavailable.'}
            </p>
          </div>

          <div>
            ${hasPerspectives ? `
              <div class="pt-2 border-t border-slate-800/80 mb-3">
                <button onclick="togglePerspectives('${art.id || art.url}')" class="text-[11px] font-mono text-indigo-400 hover:text-indigo-300 flex items-center justify-between w-full">
                  <span>+ ${art.perspectives.length} other perspectives</span>
                  <span>▾</span>
                </button>
                <div id="perspectives-${art.id || art.url}" class="hidden mt-2 space-y-1.5 bg-slate-950/60 p-2 rounded-lg border border-slate-800 text-xs">
                  ${art.perspectives.map(p => `
                    <div class="flex items-baseline justify-between gap-2 border-b border-slate-800/40 pb-1 last:border-0">
                      <span class="text-[10px] font-mono text-slate-400 font-semibold">${p.source_name}:</span>
                      <a href="${p.url}" target="_blank" class="text-slate-300 hover:text-sky-300 text-[11px] truncate flex-1">${p.title}</a>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-slate-400">
              <div class="flex items-center gap-1">
                <button onclick="toggleBookmark('${encodeURIComponent(JSON.stringify(art))}')" title="Save Bookmark" class="p-1.5 rounded hover:bg-slate-800 hover:text-white ${isSaved ? 'text-sky-400' : ''}">
                  <svg class="w-4 h-4" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                </button>
                <button onclick="shareArticle('${art.title}', '${art.url}')" title="Share" class="p-1.5 rounded hover:bg-slate-800 hover:text-white">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                </button>
              </div>

              <button onclick="dismissArticle('${art.guid_hash || art.id}')" title="Dismiss" class="text-xs font-mono text-slate-500 hover:text-rose-400 px-2 py-1 rounded hover:bg-rose-500/10 transition-colors">
                Dismiss ✕
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function renderListRowHTML(art) {
      const isSaved = state.bookmarks.has(art.url);
      const hasPerspectives = art.perspectives && art.perspectives.length > 0;
      const toneColor = art.tone === 'bullish' ? 'bg-emerald-400' : art.tone === 'caution' ? 'bg-rose-400' : 'bg-sky-400';

      return `
        <div class="bg-slate-900/60 hover:bg-slate-900 border border-slate-800 rounded-lg p-3 transition-all flex flex-col gap-2">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 min-w-0 flex-1">
              <span class="w-1.5 h-1.5 rounded-full ${toneColor} flex-shrink-0"></span>
              <span class="text-[11px] font-mono text-slate-400 w-24 flex-shrink-0 truncate">${art.source_name}</span>
              <a href="${art.url}" target="_blank" class="font-serif text-sm font-semibold text-slate-200 hover:text-sky-300 truncate">${art.title}</a>
            </div>

            <div class="flex items-center gap-3 flex-shrink-0">
              <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-400 font-bold border border-sky-500/20">${art.dynamicScore}</span>
              ${hasPerspectives ? `
                <button onclick="togglePerspectives('${art.id || art.url}')" class="text-[11px] font-mono text-indigo-400 hover:text-indigo-300">
                  +${art.perspectives.length} views
                </button>
              ` : ''}
              <button onclick="toggleBookmark('${encodeURIComponent(JSON.stringify(art))}')" class="text-slate-400 hover:text-white ${isSaved ? 'text-sky-400' : ''}">★</button>
              <button onclick="dismissArticle('${art.guid_hash || art.id}')" class="text-slate-500 hover:text-rose-400 text-xs">✕</button>
            </div>
          </div>

          ${hasPerspectives ? `
            <div id="perspectives-${art.id || art.url}" class="hidden pl-6 py-1 border-l-2 border-slate-800 space-y-1 text-xs">
              ${art.perspectives.map(p => `
                <div class="flex items-center gap-2 font-mono text-[11px]">
                  <span class="text-slate-500">${p.source_name}:</span>
                  <a href="${p.url}" target="_blank" class="text-slate-300 hover:text-sky-300 truncate">${p.title}</a>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    // Normalized Archimedean Spiral Word Cloud
    function renderWordCloud() {
      const container = document.getElementById('wordCloudContainer');
      if (!container) return;

      const activePool = state.articles.filter(a => !state.dismissedIds.has(a.id || a.url));
      if (activePool.length === 0) {
        container.innerHTML = '<span class="text-xs font-mono text-slate-500">No articles in active slice.</span>';
        return;
      }

      const stopWords = new Set([
        'the','and','for','that','with','from','this','will','amid','after',
        'says','about','into','over','more','their','than','year','market',
        'have','been','were','also','could','under','first','per','what','some',
        'australia','australian','global','record','high','low','report','today'
      ]);

      const auArticles = activePool.filter(a => a.region === 'AU');
      const globalArticles = activePool.filter(a => a.region !== 'AU');

      const totalAU = Math.max(1, auArticles.length);
      const totalGlobal = Math.max(1, globalArticles.length);

      // Scale AU vocabulary weight in Global mode
      const auWeightModifier = state.scope === 'global' ? 0.20 : 1.0;
      const globalWeightModifier = state.scope === 'au' ? 0.0 : 1.0;

      const wordScores = {};
      const wordSentiment = {};

      function processPool(pool, poolTotal, modifier) {
        if (modifier === 0) return;
        pool.forEach(a => {
          const text = `${a.title} ${a.summary || ''}`.toLowerCase();
          const tokens = text.match(/\b[a-zA-Z]{4,}\b/g) || [];
          const uniqueTokens = new Set(tokens);

          uniqueTokens.forEach(t => {
            if (!stopWords.has(t)) {
              const increment = (1 / poolTotal) * modifier;
              wordScores[t] = (wordScores[t] || 0) + increment;
              if (!wordSentiment[t] || a.tone !== 'neutral') {
                wordSentiment[t] = a.tone || 'neutral';
              }
            }
          });
        });
      }

      processPool(auArticles, totalAU, auWeightModifier);
      processPool(globalArticles, totalGlobal, globalWeightModifier);

      const terms = Object.entries(wordScores)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 26);

      const termCountBadge = document.getElementById('cloudTermCount');
      if (termCountBadge) {
        termCountBadge.textContent = `${terms.length} salient terms (${state.scope.toUpperCase()})`;
      }

      container.innerHTML = '';
      const width = container.clientWidth || 800;
      const height = container.clientHeight || 280;
      const centerX = width / 2;
      const centerY = height / 2;

      const maxWeight = terms[0] ? terms[0][1] : 1;
      const minWeight = terms[terms.length - 1] ? terms[terms.length - 1][1] : 0;
      const placedBoxes = [];

      function doesCollide(box1, box2) {
        const pad = 4;
        return !(
          box1.x + box1.w + pad < box2.x ||
          box1.x > box2.x + box2.w + pad ||
          box1.y + box1.h + pad < box2.y ||
          box1.y > box2.y + box2.h + pad
        );
      }

      terms.forEach(([word, score]) => {
        const relScore = maxWeight === minWeight ? 1 : (score - minWeight) / (maxWeight - minWeight);
        const fontSize = Math.round(13 + (relScore * 28));
        const fontWeight = relScore > 0.6 ? 700 : relScore > 0.3 ? 600 : 400;

        const tone = wordSentiment[word];
        let colorClass = 'text-slate-400 hover:text-white';
        if (tone === 'bullish') colorClass = 'text-emerald-400 hover:text-emerald-200';
        else if (tone === 'caution') colorClass = 'text-rose-400 hover:text-rose-200';
        else if (relScore > 0.5) colorClass = 'text-sky-300 hover:text-sky-100';

        const span = document.createElement('span');
        span.className = `absolute cursor-pointer transition-transform duration-200 ${colorClass}`;
        span.style.fontSize = `${fontSize}px`;
        span.style.fontWeight = fontWeight;
        span.style.fontFamily = 'Newsreader, serif';
        span.style.whiteSpace = 'nowrap';
        span.textContent = word;
        span.onclick = () => setKeywordFilter(word);

        container.appendChild(span);

        const w = span.offsetWidth || (word.length * fontSize * 0.55);
        const h = span.offsetHeight || (fontSize * 1.2);

        let angle = Math.random() * 6.28;
        let radius = 0;
        const step = 0.35;
        const maxRadius = Math.max(width, height) / 2;
        let placed = false;

        while (radius < maxRadius) {
          const x = centerX + radius * Math.cos(angle) - (w / 2);
          const y = centerY + (radius * 0.52) * Math.sin(angle) - (h / 2);

          const candidateBox = { x, y, w, h };
          let collision = false;

          for (let i = 0; i < placedBoxes.length; i++) {
            if (doesCollide(candidateBox, placedBoxes[i])) {
              collision = true;
              break;
            }
          }

          if (!collision) {
            span.style.left = `${Math.round(x)}px`;
            span.style.top = `${Math.round(y)}px`;
            placedBoxes.push(candidateBox);
            placed = true;
            break;
          }

          angle += step;
          radius = 3.6 * angle;
        }

        if (!placed) span.style.display = 'none';
      });
    }

    // Setters & UI state
    window.setScope = function(scope) {
      state.scope = scope;
      document.getElementById('btnScopeAU').className = scope === 'au' ? 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-sky-500 text-white font-semibold' : 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('btnScopeGlobal').className = scope === 'global' ? 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-sky-500 text-white font-semibold' : 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200';
      loadLiveHeadlines();
    };

    window.setTimeFrame = function(tf) {
      state.timeFrame = tf;
      document.getElementById('btnTimeDaily').className = tf === 'daily' ? 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-white font-semibold' : 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('btnTimeWeekly').className = tf === 'weekly' ? 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all bg-slate-800 text-white font-semibold' : 'px-3.5 py-1.5 rounded-lg text-xs font-medium transition-all text-slate-400 hover:text-slate-200';
      loadLiveHeadlines();
    };

    window.setViewMode = function(mode) {
      state.viewMode = mode;
      document.getElementById('btnViewCard').className = mode === 'card' ? 'p-1.5 rounded-lg text-xs transition-all bg-slate-800 text-white' : 'p-1.5 rounded-lg text-xs transition-all text-slate-400 hover:text-slate-200';
      document.getElementById('btnViewList').className = mode === 'list' ? 'p-1.5 rounded-lg text-xs transition-all bg-slate-800 text-white' : 'p-1.5 rounded-lg text-xs transition-all text-slate-400 hover:text-slate-200';
      renderArticles();
    };

    window.handleSortChange = function(val) {
      state.sortBy = val;
      renderArticles();
    };

    window.setKeywordFilter = function(word) {
      state.keywordFilter = word;
      const badge = document.getElementById('activeKeywordBadge');
      document.getElementById('activeKeywordText').textContent = `#${word}`;
      badge.classList.remove('hidden');
      badge.classList.add('flex');
      renderArticles();
    };

    window.clearKeywordFilter = function() {
      state.keywordFilter = null;
      const badge = document.getElementById('activeKeywordBadge');
      badge.classList.add('hidden');
      badge.classList.remove('flex');
      renderArticles();
    };

    window.togglePerspectives = function(id) {
      const el = document.getElementById(`perspectives-${id}`);
      if (el) el.classList.toggle('hidden');
    };

    window.dismissArticle = function(rawId) {
      if (!rawId) return;
      const id = String(rawId);
      
      state.dismissedIds.add(id);
      state.lastDismissedId = id;
      
      // Persist as string array
      localStorage.setItem('aio_dismissed', JSON.stringify(Array.from(state.dismissedIds)));
      
      // Trigger Toast Notification
      const toast = document.getElementById('undoToast');
      if (toast) {
        toast.classList.remove('translate-y-20', 'opacity-0');
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 4500);
      }

      // Re-render UI immediately
      renderApp();
    };

    window.undoDismiss = function() {
      if (state.lastDismissedId) {
        state.dismissedIds.delete(String(state.lastDismissedId));
        state.lastDismissedId = null;
        localStorage.setItem('aio_dismissed', JSON.stringify(Array.from(state.dismissedIds)));
        
        const toast = document.getElementById('undoToast');
        if (toast) toast.classList.add('translate-y-20', 'opacity-0');
        
        renderApp();
      }
    };

    window.restoreDismissed = function() {
      state.dismissedIds.clear();
      state.lastDismissedId = null;
      localStorage.removeItem('aio_dismissed');
      renderApp();
    };

    function updateDismissedUI() {
      const btn = document.getElementById('btnRestoreDismissed');
      const count = state.dismissedIds.size;
      document.getElementById('dismissedCount').textContent = count;
      btn.className = count > 0 ? 'text-xs text-slate-400 hover:text-slate-200 underline font-mono px-2 py-1' : 'hidden';
    }

    window.toggleBookmark = function(encodedArt) {
      const art = JSON.parse(decodeURIComponent(encodedArt));
      if (state.bookmarks.has(art.url)) {
        state.bookmarks.delete(art.url);
      } else {
        state.bookmarks.set(art.url, art);
      }
      localStorage.setItem('aio_bookmarks', JSON.stringify(Array.from(state.bookmarks.entries())));
      renderArticles();
      updateBookmarkUI();
    };

    function updateBookmarkUI() {
      const count = state.bookmarks.size;
      const badge = document.getElementById('bookmarkBadge');
      badge.textContent = count;
      badge.className = count > 0 ? 'absolute -top-1 -right-1 w-4 h-4 bg-sky-500 rounded-full text-[9px] font-bold flex items-center justify-center text-white' : 'hidden';

      const container = document.getElementById('bookmarksList');
      if (count === 0) {
        container.innerHTML = '<p class="text-xs font-mono text-slate-500">No saved articles yet.</p>';
        return;
      }
      container.innerHTML = Array.from(state.bookmarks.values()).map(b => `
        <div class="p-3 bg-slate-950 border border-slate-800 rounded-lg text-xs space-y-1">
          <span class="text-[10px] font-mono text-slate-500">${b.source_name}</span>
          <h4 class="font-serif font-bold text-slate-200"><a href="${b.url}" target="_blank" class="hover:text-sky-300">${b.title}</a></h4>
          <button onclick="toggleBookmark('${encodeURIComponent(JSON.stringify(b))}')" class="text-rose-400 hover:underline text-[10px] font-mono">Remove</button>
        </div>
      `).join('');
    }

    window.toggleBookmarksModal = function(show) {
      document.getElementById('bookmarksModal').className = show ? 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex justify-end' : 'hidden';
    };

    window.togglePreferencesModal = function(show) {
      document.getElementById('preferencesModal').className = show ? 'fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4' : 'hidden';
      if (show) renderPreferencesUI();
    };

    function renderPinnedBar() {
      const container = document.getElementById('pinnedTopicsContainer');
      container.innerHTML = Array.from(state.pinnedTopics).map(topic => `
        <span onclick="setKeywordFilter('${topic}')" class="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-sky-300 cursor-pointer text-[11px] font-medium border border-slate-700">
          ${topic}
        </span>
      `).join('');
    }

    function renderPreferencesUI() {
      document.getElementById('prefPinnedList').innerHTML = Array.from(state.pinnedTopics).map(p => `
        <span class="px-2 py-1 bg-slate-800 rounded text-xs text-sky-300 flex items-center gap-1">
          ${p} <button onclick="removePinnedTopic('${p}')" class="text-slate-500 hover:text-white">✕</button>
        </span>
      `).join('');
      document.getElementById('prefMutedList').innerHTML = Array.from(state.mutedKeywords).map(m => `
        <span class="px-2 py-1 bg-slate-800 rounded text-xs text-rose-300 flex items-center gap-1">
          ${m} <button onclick="removeMutedKeyword('${m}')" class="text-slate-500 hover:text-white">✕</button>
        </span>
      `).join('');
    }

    window.addPinnedTopic = function() {
      const val = document.getElementById('newTopicInput').value.trim();
      if (val) {
        state.pinnedTopics.add(val);
        localStorage.setItem('aio_pinned', JSON.stringify(Array.from(state.pinnedTopics)));
        document.getElementById('newTopicInput').value = '';
        renderPreferencesUI();
        renderApp();
      }
    };

    window.removePinnedTopic = function(topic) {
      state.pinnedTopics.delete(topic);
      localStorage.setItem('aio_pinned', JSON.stringify(Array.from(state.pinnedTopics)));
      renderPreferencesUI();
      renderApp();
    };

    window.addMutedKeyword = function() {
      const val = document.getElementById('newMuteInput').value.trim();
      if (val) {
        state.mutedKeywords.add(val);
        localStorage.setItem('aio_muted', JSON.stringify(Array.from(state.mutedKeywords)));
        document.getElementById('newMuteInput').value = '';
        renderPreferencesUI();
        renderApp();
      }
    };

    window.removeMutedKeyword = function(keyword) {
      state.mutedKeywords.delete(keyword);
      localStorage.setItem('aio_muted', JSON.stringify(Array.from(state.mutedKeywords)));
      renderPreferencesUI();
      renderApp();
    };

    window.shareArticle = function(title, url) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(`${title} - ${url}`);
        alert('Copied citation link to clipboard!');
      }
    };

    window.exportBookmarks = function(format) {
      const items = Array.from(state.bookmarks.values());
      let dataStr = '';
      let filename = `all-in-one-saved.${format}`;
      if (format === 'json') {
        dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
      } else {
        const md = items.map(i => `- [${i.title}](${i.url}) — *${i.source_name}*`).join('\n');
        dataStr = "data:text/markdown;charset=utf-8," + encodeURIComponent(md);
      }
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", filename);
      a.click();
    };

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === '/') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      } else if (e.key.toLowerCase() === 'v') {
        setViewMode(state.viewMode === 'card' ? 'list' : 'card');
      }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      state.searchQuery = e.target.value.trim();
      renderArticles();
    });

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            renderWordCloud();
        }, 250);
    });

    // Initial load
    loadLiveHeadlines();
  </script>
</body>
</html>
